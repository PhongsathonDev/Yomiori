<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กระดานงาน · Yomiori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'IBM Plex Sans Thai',sans-serif;color:#202b48;background:#eef2f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #d75080;outline-offset:3px}header{background:#243453;color:white;padding:40px max(24px,calc((100vw - 1100px)/2));position:relative;overflow:hidden}header:after{content:'読織';position:absolute;right:6%;top:-48px;font-size:170px;font-weight:700;color:#ffffff08;pointer-events:none}header p{color:#bfcde2;margin:6px 0 0}h1{font-size:clamp(30px,5vw,48px);margin:8px 0;font-weight:600;letter-spacing:-.03em}.brand{font-weight:700;color:#ffb0c9}.wrap{max-width:1100px;margin:auto;padding:32px 24px 80px}.overview{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:28px}.overview strong{font-size:30px}.overview span{color:#596a84}.line{height:38px;width:1px;background:#cbd4e1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:5px;background:#dfe6f0;padding:4px;border-radius:12px}.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 16px;color:#41516b}.tabs button[aria-pressed=true]{background:#fff;color:#283b61;box-shadow:0 1px 4px #20314b20}.search{margin-left:auto;min-width:220px;flex:1;max-width:340px;border:1px solid #cbd6e5;border-radius:10px;background:#fff;padding:11px 14px;color:#202b48}.refresh{border:1px solid #cbd6e5;background:white;border-radius:10px;padding:10px 15px;color:#354968}.notice{color:#63728a;font-size:14px;margin:0 0 16px}.list{background:white;border:1px solid #dbe3ed;border-radius:16px;overflow:hidden}.item+ .item{border-top:1px solid #e7ecf2}summary{list-style:none;cursor:pointer;padding:20px 24px;display:grid;grid-template-columns:95px 1fr auto;gap:16px;align-items:center}summary::-webkit-details-marker{display:none}.id{color:#617691;font-size:13px;font-weight:700}.title{font-weight:600;font-size:16px}.badge{font-size:12px;font-weight:600;border-radius:30px;padding:5px 10px;white-space:nowrap}.open{background:#fff0f4;color:#a52d5c}.closed{background:#e8f4ef;color:#287452}.detail{padding:0 24px 24px 135px;color:#42536d;line-height:1.75}.detail p{white-space:pre-wrap;max-width:75ch}.detail a{color:#365c9e}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button,.actions a{border:1px solid #ccd8e7;border-radius:8px;background:#fff;padding:8px 12px;text-decoration:none;color:#344d76;font-size:14px}.empty{padding:35px;text-align:center;color:#64748b}footer{margin-top:25px;color:#738197;font-size:13px}@media(max-width:600px){header{padding:30px 20px}.wrap{padding:24px 16px}.search{order:3;max-width:none;min-width:100%}summary{grid-template-columns:1fr auto;gap:5px;padding:18px}.id{grid-column:1}.title{grid-column:1;grid-row:2}.badge{grid-column:2;grid-row:1 / 3}.detail{padding:0 18px 20px}.overview{gap:16px}}
  </style>
</head>
<body>
<header><div class="brand">Yomiori / กระดานงาน</div><h1>งานของเรา อยู่ตรงนี้</h1><p>ดูสิ่งที่ยังต้องทำ สิ่งที่เสร็จแล้ว และเลือกงานที่จะทำต่อ</p></header>
<main class="wrap">
  <section class="overview" aria-label="ภาพรวม"><div><strong id="openCount">–</strong> <span>งานค้าง</span></div><div class="line"></div><div><strong id="closedCount">–</strong> <span>งานเสร็จ</span></div><div class="line"></div><div><strong id="totalCount">–</strong> <span>รายการทั้งหมด</span></div></section>
  <div class="toolbar"><div class="tabs" aria-label="กรองสถานะ"><button data-filter="open" aria-pressed="true">งานค้าง</button><button data-filter="closed" aria-pressed="false">เสร็จแล้ว</button><button data-filter="all" aria-pressed="false">ทั้งหมด</button></div><input class="search" id="search" type="search" placeholder="ค้นหาชื่อหรือรหัสงาน" aria-label="ค้นหางาน"><button class="refresh" id="refresh">โหลดข้อมูลใหม่</button></div>
  <p class="notice" id="notice" role="status">กำลังโหลดรายการงานจาก GitHub…</p><div class="list" id="list"></div>
  <footer>ข้อมูลจาก .wayfinder/issues บน GitHub สาขา main · กดรายการเพื่อดูรายละเอียดและคัดลอกคำสั่ง</footer>
</main>
<script>
const api='https://api.github.com/repos/PhongsathonDev/Yomiori';
const list=document.querySelector('#list'), notice=document.querySelector('#notice'), search=document.querySelector('#search'); let items=[], filter='open';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(text,url){const parts=text.split(/^---\s*$/m);if(parts.length<3)throw Error('รูปแบบไฟล์ไม่ถูกต้อง');const fields={};for(const line of parts[1].split(/\r?\n/)){const m=line.match(/^([\w]+):\s*(.*)$/);if(m)fields[m[1]]=m[2].trim()}if(!fields.id||!fields.title||!['open','closed'].includes(fields.state))throw Error('ข้อมูลสถานะไม่ครบ');return {...fields,body:parts.slice(2).join('---').trim(),url}}
function render(){document.querySelector('#openCount').textContent=items.filter(x=>x.state==='open').length;document.querySelector('#closedCount').textContent=items.filter(x=>x.state==='closed').length;document.querySelector('#totalCount').textContent=items.length;const q=search.value.trim().toLowerCase();const shown=items.filter(x=>(filter==='all'||x.state===filter)&&`${x.id} ${x.title} ${x.body}`.toLowerCase().includes(q));list.innerHTML=shown.length?shown.map(x=>`<details class="item"><summary><span class="id">${esc(x.id)}</span><span class="title">${esc(x.title)}</span><span class="badge ${x.state}">${x.state==='open'?'ค้างอยู่':'เสร็จแล้ว'}</span></summary><div class="detail"><p>${esc(x.body)}</p><div class="actions"><button class="copy" data-id="${esc(x.id)}" data-title="${esc(x.title)}">คัดลอกคำสั่งทำงานนี้</button><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">ดูไฟล์ต้นฉบับบน GitHub</a></div></div></details>`).join(''):'<div class="empty">ไม่พบรายการ ลองเปลี่ยนตัวกรองหรือคำค้น</div>'}
async function load(){notice.textContent='กำลังโหลดรายการงานจาก GitHub…';document.querySelector('#refresh').disabled=true;try{const head=await fetch(`${api}/commits/main?refresh=${Date.now()}`,{cache:'no-store'});if(!head.ok)throw Error(`GitHub ตอบกลับ ${head.status}`);const revision=(await head.json()).sha;if(!/^[0-9a-f]{40}$/.test(revision))throw Error('ไม่พบ commit ล่าสุด');const response=await fetch(`${api}/contents/.wayfinder/issues?ref=${revision}`,{cache:'no-store'});if(!response.ok)throw Error(`GitHub ตอบกลับ ${response.status}`);const files=(await response.json()).filter(x=>/^WF-\d+\.md$/.test(x.name));const loaded=await Promise.all(files.map(async file=>{const url=`https://raw.githubusercontent.com/PhongsathonDev/Yomiori/${revision}/.wayfinder/issues/${encodeURIComponent(file.name)}`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`โหลด ${file.name} ไม่สำเร็จ`);return parse(await r.text(),file.html_url)}));items=loaded.sort((a,b)=>b.id.localeCompare(a.id));render();notice.textContent=`โหลดเมื่อ ${new Date().toLocaleString('th-TH')} · commit ${revision.slice(0,7)} · ${items.length} รายการ`}catch(e){notice.textContent=`โหลดข้อมูลไม่สำเร็จ: ${e.message} กรุณาลองใหม่`;if(!items.length)list.innerHTML='<div class="empty">ยังไม่สามารถแสดงรายการงานได้</div>'}finally{document.querySelector('#refresh').disabled=false}}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));search.addEventListener('input',render);document.querySelector('#refresh').addEventListener('click',load);list.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;const text=`ทำ ${b.dataset.id}: ${b.dataset.title}`;try{await navigator.clipboard.writeText(text);b.textContent='คัดลอกแล้ว'}catch{window.prompt('คัดลอกข้อความนี้เพื่อสั่งงาน',text)}});load();
</script></body></html>
