<!doctype html>
<html lang="th" data-variant="F" data-defaults='{"theme":"light","font":"serif"}'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>UI Lab F · มังงะ | Yomiori</title>
    <link rel="stylesheet" href="/web-v2/css/fonts.css" />
    <link rel="stylesheet" href="shared/mali.css" />
    <link rel="stylesheet" href="shared/lab.css" />
    <style>
      /* ------------------------------------------------------------------
         F · มังงะ — panels, speech balloons, halftone, thick ink borders.
         ------------------------------------------------------------------ */
      :root {
        --f-ink: #211d18;
        --f-border: 2px solid var(--ink);
      }

      html[data-theme='dark'] {
        --f-ink: #ece4d6;
      }

      body {
        overflow-x: hidden;
      }

      .f-head {
        position: sticky;
        top: 0;
        z-index: 35;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px clamp(16px, 4vw, 40px);
        background: color-mix(in srgb, var(--paper) 96%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: var(--f-border);
      }

      .f-masthead {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: var(--font-serif);
        font-size: 1.28rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      .f-masthead span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 5px;
        border: 2px solid var(--ink);
        font-family: var(--font-jp);
        font-size: 0.7em;
        line-height: 1.1;
        color: var(--ink);
        transform: rotate(-2deg);
      }

      .f-issue {
        font-family: var(--font-plex);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      .f-tools {
        display: flex;
        gap: 5px;
      }

      .f-tools button {
        min-height: 32px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 0.66rem;
        cursor: pointer;
      }

      .f-tools button:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .f-main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px clamp(16px, 4vw, 40px) 80px;
      }

      .f-page {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 14px;
      }

      .f-panel {
        position: relative;
        border: var(--f-border);
        background: var(--surface);
        padding: 18px;
        min-width: 0;
        overflow: hidden;
      }

      .f-panel-no {
        font-family: var(--font-plex);
        font-size: 0.58rem;
        letter-spacing: 0.12em;
        color: var(--faint);
        margin-bottom: 8px;
      }

      .f-halftone {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(var(--line) 0.8px, transparent 0.8px);
        background-size: 7px 7px;
        opacity: 0.55;
        pointer-events: none;
      }

      .f-hero {
        grid-column: span 8;
        display: grid;
        grid-template-columns: minmax(200px, 0.8fr) minmax(0, 1.2fr);
        gap: 26px;
        padding: 24px;
        background: var(--paper-card, var(--surface));
      }

      .f-hero-cover {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border: var(--f-border);
      }

      .f-hero-copy {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .f-label {
        display: inline-block;
        align-self: flex-start;
        padding: 2px 7px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-family: var(--font-plex);
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
        transform: rotate(-1deg);
      }

      .f-hero h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.02em;
      }

      .f-hero-novel {
        margin-top: 7px;
        font-size: 0.68rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .f-bubble {
        position: relative;
        margin-top: 18px;
        max-width: 34ch;
        padding: 10px 13px;
        border: 2px solid var(--ink);
        border-radius: 14px 14px 14px 3px;
        background: var(--surface);
        font-family: var(--font-plex);
        font-size: 0.7rem;
        line-height: 1.6;
      }

      .f-bubble::after {
        content: '';
        position: absolute;
        left: 15px;
        bottom: -8px;
        width: 12px;
        height: 12px;
        background: var(--surface);
        border-left: 2px solid var(--ink);
        border-bottom: 2px solid var(--ink);
        transform: skewY(-18deg) rotate(-45deg);
      }

      .f-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 22px;
      }

      .f-btn {
        min-height: 38px;
        padding: 8px 15px;
        border: 2px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-family: var(--font-plex);
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 3px 3px 0 color-mix(in srgb, var(--ink) 20%, transparent);
      }

      .f-btn:hover {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 color-mix(in srgb, var(--ink) 20%, transparent);
      }

      .f-btn-quiet {
        border: 2px solid var(--ink);
        background: transparent;
        color: var(--ink);
      }

      .f-index {
        grid-column: span 4;
        padding: 0;
      }

      .f-index-head {
        padding: 12px 14px;
        border-bottom: var(--f-border);
        background: var(--ink);
        color: var(--paper);
        font-family: var(--font-plex);
        font-size: 0.66rem;
        letter-spacing: 0.08em;
      }

      .f-index-row {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .f-index-row:hover {
        background: var(--paper-2);
      }

      .f-index-row:last-child {
        border-bottom: 0;
      }

      .f-index-no {
        font-family: var(--font-serif);
        font-size: 0.7rem;
        color: var(--faint);
      }

      .f-index-title {
        font-size: 0.68rem;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .f-book {
        grid-column: span 4;
        display: flex;
        flex-direction: column;
        padding: 12px;
      }

      [data-books] {
        display: contents;
      }

      .f-book:nth-of-type(3) {
        grid-column: span 4;
      }

      .f-book-cover {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        object-position: center 24%;
        border: var(--f-border);
        filter: saturate(0.9);
      }

      .f-book-body {
        position: relative;
        z-index: 1;
        padding-top: 12px;
      }

      .f-book h2 {
        font-family: var(--font-serif);
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .f-book-meta {
        margin-top: 5px;
        font-family: var(--font-plex);
        font-size: 0.62rem;
        color: var(--muted);
      }

      .f-book-status {
        display: inline-block;
        margin-top: 9px;
        padding: 2px 7px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-family: var(--font-plex);
        font-size: 0.6rem;
        color: var(--ink);
        transform: rotate(-1deg);
      }

      .f-book-open {
        margin-top: 12px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-family: var(--font-plex);
        font-size: 0.66rem;
        text-align: left;
        cursor: pointer;
      }

      /* Detail ---------------------------------------------------------- */
      .f-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 14px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 0.68rem;
        cursor: pointer;
      }

      .f-spread {
        display: grid;
        grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
        gap: 16px;
        align-items: start;
      }

      .f-left-page,
      .f-right-page {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .f-cover-panel {
        padding: 12px;
      }

      .f-cover-panel img {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border: var(--f-border);
      }

      .f-cover-caption {
        margin-top: 10px;
        font-family: var(--font-plex);
        font-size: 0.64rem;
        line-height: 1.6;
        color: var(--muted);
      }

      .f-title-panel {
        padding: 22px;
      }

      .f-title-panel h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.6rem, 3vw, 2.5rem);
        font-weight: 600;
        line-height: 1.35;
      }

      .f-title-panel .f-original {
        margin-top: 8px;
        font-family: var(--font-jp);
        font-size: 0.72rem;
        color: var(--muted);
        line-height: 1.7;
      }

      .f-tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 12px;
      }

      .f-tag-row span {
        padding: 2px 6px;
        border: 1px solid var(--line);
        font-family: var(--font-plex);
        font-size: 0.62rem;
        color: var(--muted);
      }

      .f-caption-panel {
        padding: 0;
      }

      .f-caption-head {
        padding: 8px 12px;
        border-bottom: var(--f-border);
        background: var(--ink);
        color: var(--paper);
        font-family: var(--font-plex);
        font-size: 0.62rem;
        letter-spacing: 0.1em;
      }

      .f-caption-body {
        padding: 18px;
        font-family: var(--font-serif);
        font-size: 0.84rem;
        line-height: 1.9;
        color: var(--ink-2);
      }

      .f-cast-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 14px;
      }

      .f-cast {
        width: 84px;
      }

      .f-cast img,
      .f-cast .f-initial {
        width: 46px;
        height: 46px;
        object-fit: cover;
        border: 2px solid var(--ink);
        background: var(--paper);
        filter: grayscale(0.2);
      }

      .f-cast .f-initial {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-serif);
        color: var(--ink);
      }

      .f-cast-name {
        margin-top: 5px;
        font-family: var(--font-plex);
        font-size: 0.63rem;
        line-height: 1.4;
      }

      .f-cast-role {
        font-size: 0.58rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .f-chapter-panel {
        padding: 0;
      }

      .f-chapter-list {
        max-height: 520px;
        overflow-y: auto;
      }

      .f-chapter {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: baseline;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .f-chapter:hover {
        background: var(--paper-2);
      }

      .f-chapter-no {
        font-family: var(--font-plex);
        font-size: 0.62rem;
        color: var(--faint);
      }

      .f-chapter-title {
        font-size: 0.72rem;
        line-height: 1.5;
      }

      .f-chapter-arrow {
        font-family: var(--font-plex);
        font-size: 0.58rem;
        color: var(--faint);
      }

      .f-empty {
        padding: 18px;
        font-size: 0.72rem;
        color: var(--muted);
      }

      /* Reader ---------------------------------------------------------- */
      body[data-lab-screen='reader'] .f-head {
        display: none;
      }

      .f-reader {
        min-height: 100svh;
      }

      .f-reader-bar {
        position: sticky;
        top: 0;
        z-index: 35;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 9px 16px;
        background: var(--paper);
        border-bottom: var(--f-border);
      }

      .f-reader-bar-left,
      .f-reader-bar-right {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }

      .f-reader-bar button {
        min-height: 30px;
        padding: 3px 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-family: var(--font-plex);
        font-size: 0.64rem;
        cursor: pointer;
      }

      .f-reader-bar button:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .f-reader-context {
        font-family: var(--font-plex);
        font-size: 0.62rem;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .f-reading-wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px 16px 80px;
      }

      .f-chapter-panel {
        border: var(--f-border);
        background: var(--surface);
        padding: 22px;
        margin-bottom: 14px;
        position: relative;
        overflow: hidden;
      }

      .f-chapter-panel .f-halftone {
        opacity: 0.3;
      }

      .f-chapter-panel h1 {
        position: relative;
        z-index: 1;
        font-family: var(--font-serif);
        font-size: clamp(1.7rem, 3.4vw, 2.6rem);
        font-weight: 600;
        line-height: 1.35;
      }

      .f-chapter-panel p {
        position: relative;
        z-index: 1;
        margin-top: 8px;
        font-family: var(--font-plex);
        font-size: 0.66rem;
        color: var(--muted);
      }

      .f-text-panel {
        border: var(--f-border);
        background: var(--surface);
        padding: clamp(22px, 5vw, 44px);
      }

      .f-text-panel .lab-speech {
        position: relative;
        margin: 1.5em 0;
        padding: 10px 14px;
        border: 2px solid var(--ink);
        border-radius: 11px 11px 11px 2px;
        background: var(--paper);
        font-family: var(--font-plex);
        font-size: 0.88em;
        line-height: 1.8;
      }

      .f-text-panel .lab-speech::after {
        content: '';
        position: absolute;
        left: 14px;
        bottom: -7px;
        width: 10px;
        height: 10px;
        background: var(--paper);
        border-left: 2px solid var(--ink);
        border-bottom: 2px solid var(--ink);
        transform: skewY(-18deg) rotate(-45deg);
      }

      .f-text-panel .lab-who {
        display: block;
        margin-bottom: 4px;
        font-family: var(--font-plex);
        font-size: 0.62rem;
      }

      .f-text-panel .lab-avatar {
        width: 20px;
        height: 20px;
        vertical-align: middle;
      }

      .f-text-panel .lab-role {
        display: inline;
        margin-left: 4px;
        font-size: 0.58rem;
      }

      .f-text-panel .lab-line {
        font-family: var(--font-serif);
      }

      .f-sample-note {
        margin-top: 12px;
        font-family: var(--font-plex);
        font-size: 0.6rem;
        color: var(--faint);
      }

      .f-reader-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }

      .f-reader-nav button {
        padding: 12px;
        border: var(--f-border);
        background: var(--surface);
        text-align: left;
        cursor: pointer;
      }

      .f-reader-nav button:last-child {
        text-align: right;
      }

      .f-reader-nav button:hover {
        background: var(--paper-2);
      }

      .f-reader-nav span {
        display: block;
        font-family: var(--font-plex);
        font-size: 0.58rem;
        color: var(--faint);
        margin-bottom: 3px;
      }

      .f-reader-nav strong {
        font-family: var(--font-serif);
        font-size: 0.76rem;
        font-weight: 500;
        color: var(--ink);
        line-height: 1.4;
      }

      .f-progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        height: 3px;
        background: repeating-linear-gradient(90deg, var(--ink) 0 14px, transparent 14px 20px);
        opacity: 0.25;
        pointer-events: none;
      }

      /* Settings / TOC -------------------------------------------------- */
      .f-settings {
        width: min(560px, calc(100vw - 28px));
        margin: auto;
        background: var(--surface);
        border: 3px solid var(--ink);
      }

      .f-settings-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 18px;
        border-bottom: var(--f-border);
        background: var(--paper-2);
      }

      .f-settings-head h2 {
        font-family: var(--font-serif);
        font-size: 1.02rem;
        font-weight: 600;
      }

      .f-settings-head p {
        margin-top: 2px;
        font-family: var(--font-plex);
        font-size: 0.62rem;
        color: var(--muted);
      }

      .f-close {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 2px solid var(--ink);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }

      .f-settings-body {
        padding: 14px 18px 20px;
        max-height: 72vh;
        overflow-y: auto;
      }

      .f-setting + .f-setting {
        margin-top: 18px;
      }

      .f-setting h3 {
        margin-bottom: 7px;
        font-family: var(--font-plex);
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 600;
      }

      .f-theme-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .f-theme-option {
        padding: 6px;
        border: 1px solid var(--line);
        background: var(--paper);
        cursor: pointer;
        text-align: left;
      }

      .f-theme-option[aria-pressed='true'] {
        border: 2px solid var(--ink);
      }

      .f-theme-chip {
        display: block;
        height: 34px;
        margin-bottom: 5px;
      }

      .f-theme-option b {
        font-family: var(--font-plex);
        font-size: 0.6rem;
        font-weight: 500;
      }

      .f-font-option,
      .f-dialogue-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 7px 8px;
        margin-bottom: 5px;
        border: 1px solid var(--line);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .f-font-option[aria-pressed='true'],
      .f-dialogue-option[aria-pressed='true'] {
        border: 2px solid var(--ink);
      }

      .f-font-option small,
      .f-dialogue-option small {
        display: block;
        font-family: var(--font-plex);
        font-size: 0.58rem;
        color: var(--muted);
      }

      .f-range-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 2px;
        font-family: var(--font-plex);
        font-size: 0.63rem;
        color: var(--muted);
      }

      .f-range-head b {
        color: var(--ink);
        font-weight: 600;
      }

      input[type='range'] {
        width: 100%;
        height: 20px;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      input[type='range']::-webkit-slider-runnable-track {
        height: 3px;
        background: var(--ink);
        opacity: 0.3;
      }

      input[type='range']::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        margin-top: -5px;
        border-radius: 0;
        background: var(--ink);
      }

      .f-toc {
        width: min(700px, 100vw);
        height: 100dvh;
        margin: 0 auto;
        background: var(--paper);
        border-inline: var(--f-border);
      }

      .f-toc-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .f-toc-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: var(--f-border);
        background: var(--surface);
      }

      .f-toc-head h2 {
        font-family: var(--font-serif);
        font-size: 1rem;
        font-weight: 600;
      }

      .f-toc-head p {
        margin-top: 2px;
        font-family: var(--font-plex);
        font-size: 0.62rem;
        color: var(--muted);
      }

      .f-toc-list {
        flex: 1;
        overflow-y: auto;
        columns: 2;
        column-gap: 18px;
        padding: 10px 18px 40px;
      }

      .f-toc-row {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 7px;
        width: 100%;
        padding: 8px 0;
        border: 0;
        border-bottom: 1px solid var(--line-2);
        background: transparent;
        text-align: left;
        cursor: pointer;
        break-inside: avoid;
      }

      .f-toc-row:hover {
        color: var(--accent);
      }

      .f-toc-row span:first-child {
        font-family: var(--font-plex);
        font-size: 0.6rem;
        color: var(--faint);
      }

      .f-toc-row span:last-child {
        font-size: 0.7rem;
        line-height: 1.45;
      }

      .f-toc-row[aria-current='true'] {
        color: var(--accent);
      }

      /* Responsive ------------------------------------------------------ */
      @media (max-width: 980px) {
        .f-hero {
          grid-column: span 7;
          grid-template-columns: 170px minmax(0, 1fr);
        }

        .f-index {
          grid-column: span 5;
        }

        .f-book {
          grid-column: span 6;
        }
      }

      @media (max-width: 700px) {
        .f-head {
          padding: 8px 12px;
        }

        .f-masthead {
          font-size: 1.06rem;
        }

        .f-issue {
          display: none;
        }

        .f-tools button:nth-child(1) {
          font-size: 0;
        }

        .f-main {
          padding: 12px 12px 70px;
        }

        .f-page {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .f-hero {
          display: flex;
          flex-direction: column;
          gap: 14px;
          padding: 14px;
        }

        .f-hero-cover {
          width: 160px;
          margin: 0 auto;
        }

        .f-hero-copy {
          padding-bottom: 4px;
        }

        .f-spread {
          grid-template-columns: 1fr;
        }

        .f-chapter-list {
          max-height: none;
        }

        .f-reading-wrap {
          padding: 14px 10px 60px;
        }

        .f-text-panel {
          padding: 18px;
        }

        .f-chapter-panel {
          padding: 16px;
        }

        .f-reader-context {
          display: none;
        }

        .f-reader-nav {
          grid-template-columns: 1fr;
        }

        .f-reader-nav button:last-child {
          text-align: left;
        }

        .f-toc-list {
          columns: 1;
          padding: 8px 14px 40px;
        }

        .f-settings-body {
          max-height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <header class="f-head">
      <div class="f-masthead">Yomiori <span>読織</span></div>
      <p class="f-issue">UI LAB · F / มังงะรายสัปดาห์</p>
      <div class="f-tools">
        <button type="button" data-lab-theme aria-label="สลับธีมสี">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>
          <span data-theme-name>กระดาษวาชิ</span>
        </button>
        <button type="button" data-open-settings>ตั้งค่า</button>
      </div>
    </header>

    <main class="f-main">
      <section data-screen="shelf">
        <div class="f-page">
          <article class="f-panel f-hero">
            <div class="f-halftone" aria-hidden="true"></div>
            <img class="f-hero-cover" data-hero-cover src="" alt="" />
            <div class="f-hero-copy">
              <span class="f-label">อ่านค้างไว้</span>
              <h1 data-hero-title></h1>
              <p class="f-hero-novel" data-hero-novel></p>
              <div class="f-bubble" data-hero-bubble></div>
              <div class="f-actions">
                <button class="f-btn" type="button" data-hero-read>อ่านต่อตอนนี้</button>
                <button class="f-btn f-btn-quiet" type="button" data-hero-detail>ดูสารบัญ</button>
              </div>
            </div>
          </article>

          <aside class="f-panel f-index">
            <div class="f-index-head">สารบัญโรงหนังสือ</div>
            <div data-index></div>
          </aside>

          <div data-books></div>
        </div>
      </section>

      <section data-screen="detail" hidden>
        <button class="f-back" type="button" data-nav="shelf">← กลับชั้นวาง</button>
        <div class="f-spread">
          <div class="f-left-page">
            <div class="f-panel f-cover-panel">
              <div class="f-halftone" aria-hidden="true"></div>
              <img data-detail-cover src="" alt="" />
              <p class="f-cover-caption" data-detail-caption></p>
            </div>
            <div class="f-panel f-caption-panel">
              <div class="f-caption-head">ตัวละครในตอน</div>
              <div class="f-cast-row" data-detail-cast></div>
            </div>
          </div>
          <div class="f-right-page">
            <div class="f-panel f-title-panel">
              <div class="f-halftone" aria-hidden="true"></div>
              <h1 data-detail-title></h1>
              <p class="f-original" data-detail-original></p>
              <div class="f-tag-row" data-detail-tags></div>
              <div class="f-actions">
                <button class="f-btn" type="button" data-open-reader>เริ่มอ่านตอนแรก</button>
              </div>
            </div>
            <div class="f-panel f-caption-panel">
              <div class="f-caption-head">เรื่องย่อ</div>
              <div class="f-caption-body" data-detail-synopsis></div>
            </div>
            <div class="f-panel f-chapter-panel">
              <div class="f-caption-head">ตอนทั้งหมด</div>
              <div class="f-chapter-list" data-detail-chapters></div>
            </div>
          </div>
        </div>
      </section>

      <section class="f-reader" data-screen="reader" hidden>
        <div class="f-progress" aria-hidden="true"></div>
        <div class="f-reader-bar">
          <div class="f-reader-bar-left">
            <button type="button" data-nav="detail">← หน้าเรื่อง</button>
            <span class="f-reader-context" data-reader-context></span>
          </div>
          <div class="f-reader-bar-right">
            <button type="button" data-open-toc>สารบัญ</button>
            <button type="button" data-lab-theme aria-label="สลับธีมสี">ธีม</button>
            <button type="button" data-open-settings>ตั้งค่า</button>
          </div>
        </div>
        <div class="f-reading-wrap">
          <header class="f-chapter-panel">
            <div class="f-halftone" aria-hidden="true"></div>
            <h1 data-reader-title></h1>
            <p><span data-reader-number>ตอนที่ 1</span> · <span data-reader-novel></span></p>
          </header>
          <div class="f-text-panel lab-prose" data-reader-body></div>
          <p class="f-sample-note" data-reader-sample hidden>ตอนนี้ใช้ข้อความตัวอย่างจากตอนแรกของเรื่อง</p>
          <nav class="f-reader-nav" data-reader-nav></nav>
        </div>
      </section>
    </main>

    <dialog class="f-settings" data-settings>
      <div class="f-settings-head">
        <div>
          <h2>แผงตั้งค่า</h2>
          <p>ปรับหน้ากระดาษและหมึก</p>
        </div>
        <button class="f-close" type="button" data-close-settings aria-label="ปิดการตั้งค่า">×</button>
      </div>
      <div class="f-settings-body">
        <div class="f-setting">
          <h3>หมึก / ธีม</h3>
          <div class="f-theme-grid" data-setting-theme></div>
        </div>
        <div class="f-setting">
          <h3>ตัวอักษร</h3>
          <div data-setting-font></div>
        </div>
        <div class="f-setting">
          <div class="f-range-head"><span>ขนาดตัวอักษร</span><b data-value-size>18px</b></div>
          <input type="range" min="15" max="26" step="1" data-range-size aria-label="ขนาดตัวอักษร" />
        </div>
        <div class="f-setting">
          <div class="f-range-head"><span>ระยะบรรทัด</span><b data-value-leading>1.9x</b></div>
          <input type="range" min="1.6" max="2.2" step="0.1" data-range-leading aria-label="ระยะบรรทัด" />
        </div>
        <div class="f-setting">
          <h3>บอลลูนบทสนทนา</h3>
          <div data-setting-dialogue></div>
        </div>
      </div>
    </dialog>

    <dialog class="f-toc" data-toc>
      <div class="f-toc-inner">
        <div class="f-toc-head">
          <div>
            <h2>สารบัญ</h2>
            <p data-toc-subtitle></p>
          </div>
          <button class="f-close" type="button" data-close-toc aria-label="ปิดสารบัญ">×</button>
        </div>
        <div class="f-toc-list" data-toc-list></div>
      </div>
    </dialog>

    <nav class="lab-switcher" aria-label="สลับ mockup">
      <span>LAB</span>

    <script src="shared/sample.js"></script>
    <script src="shared/lab.js"></script>
    <script>
      (() => {
        const novels = Lab.novels;
        let currentNovel = novels[0];
        let currentHero = novels[0];

        const $ = (selector, scope = document) => scope.querySelector(selector);
        const $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];

        const continueNovel = novels.find((novel) => novel.id === 'kyudo-senpai') || novels[0];
        const continueChapter = Lab.firstReadingChapter(continueNovel);

        function renderShelf() {
          $('[data-hero-cover]').src = continueNovel.cover;
          $('[data-hero-cover]').alt = `ปก ${continueNovel.title}`;
          $('[data-hero-title]').textContent = continueChapter.title;
          $('[data-hero-novel]').textContent = continueNovel.title;
          $('[data-hero-bubble]').textContent = `“${continueNovel.title}” — อ่านไปแล้ว 32% เลื่อนต่อจากที่คั่นไว้ได้เลย`;

          $('[data-index]').innerHTML = novels
            .map(
              (novel, index) => `<button class="f-index-row" type="button" data-book="${novel.id}">
                <span class="f-index-no">${String(index + 1).padStart(2, '0')}</span>
                <span class="f-index-title">${Lab.esc(novel.title)}</span>
              </button>`,
            )
            .join('');

          $('[data-books]').innerHTML = novels
            .filter((novel) => novel.id !== continueNovel.id)
            .map(
              (novel) => `<article class="f-panel f-book">
                <div class="f-halftone" aria-hidden="true"></div>
                <img class="f-book-cover" src="${novel.cover}" alt="ปก ${Lab.esc(novel.title)}" loading="lazy" />
                <div class="f-book-body">
                  <h2>${Lab.esc(novel.title)}</h2>
                  <p class="f-book-meta">${Lab.esc(novel.author)} · ${novel.tags.slice(0, 2).join(' / ')}</p>
                  <span class="f-book-status">${novel.chapters.length ? 'พร้อมอ่าน' : 'รอแปลงตอน'}</span>
                  <button class="f-book-open" type="button" data-book="${novel.id}">เปิดเรื่อง →</button>
                </div>
              </article>`,
            )
            .join('');
        }

        function renderDetail(novel) {
          currentNovel = novel;
          $('[data-detail-cover]').src = novel.cover;
          $('[data-detail-cover]').alt = `ปก ${novel.title}`;
          $('[data-detail-caption]').textContent = novel.originalTitle || novel.author;
          $('[data-detail-title]').textContent = novel.title;
          $('[data-detail-original]').textContent = novel.originalTitle || '';
          $('[data-detail-tags]').innerHTML = novel.tags.map((tag) => `<span>${tag}</span>`).join('');
          $('[data-detail-synopsis]').textContent = novel.synopsis;
          $('[data-detail-cast]').innerHTML = novel.characters
            .slice(0, 4)
            .map(
              (character) => `<figure class="f-cast" style="--char:${character.color}">
                ${character.avatar ? `<img src="${character.avatar}" alt="${Lab.esc(character.name)}" loading="lazy" />` : `<span class="f-initial">${Lab.esc(character.name.charAt(0))}</span>`}
                <figcaption><div class="f-cast-name">${Lab.esc(character.name)}</div><div class="f-cast-role">${Lab.esc(character.role)}</div></figcaption>
              </figure>`,
            )
            .join('');
          $('[data-detail-chapters]').innerHTML = novel.chapters.length
            ? novel.chapters
                .map(
                  (chapter) => `<button class="f-chapter" type="button" data-chapter="${chapter.id}">
                    <span class="f-chapter-no">${Lab.chapterNumber(chapter)}</span>
                    <span class="f-chapter-title">${Lab.esc(chapter.title)}</span>
                    <span class="f-chapter-arrow">→</span>
                  </button>`,
                )
                .join('')
            : '<p class="f-empty">ยังไม่มีตอนที่แปลงเข้าสู่ระบบ</p>';
          Lab.showScreen('detail');
        }

        function renderReader(novel, chapterId) {
          currentNovel = novel;
          const prepared = Lab.prepareChapter(novel, chapterId);
          const index = novel.chapters.findIndex((item) => item.id === prepared.id);
          const prev = index > 0 ? novel.chapters[index - 1] : null;
          const next = index >= 0 && index < novel.chapters.length - 1 ? novel.chapters[index + 1] : null;
          $('[data-reader-context]').textContent = `${novel.title} · ${prepared.title}`;
          $('[data-reader-title]').textContent = prepared.title;
          $('[data-reader-number]').textContent = `ตอนที่ ${prepared.number}`;
          $('[data-reader-novel]').textContent = novel.title;
          Lab.mountChapter($('[data-reader-body]'), novel, prepared);
          $('[data-reader-sample]').hidden = !prepared.sample;
          $('[data-reader-nav]').innerHTML = `
            ${prev ? `<button type="button" data-chapter="${prev.id}"><span>ตอนก่อนหน้า</span><strong>${Lab.esc(prev.title)}</strong></button>` : '<span></span>'}
            ${next ? `<button type="button" data-chapter="${next.id}"><span>ตอนถัดไป</span><strong>${Lab.esc(next.title)}</strong></button>` : '<span></span>'}`;
          $('[data-toc-subtitle]').textContent = novel.title;
          $('[data-toc-list]').innerHTML = novel.chapters
            .map(
              (chapter) => `<button class="f-toc-row" type="button" data-chapter="${chapter.id}" aria-current="${chapter.id === prepared.id}">
                <span>${Lab.chapterNumber(chapter)}</span><span>${Lab.esc(chapter.title)}</span>
              </button>`,
            )
            .join('');
          Lab.showScreen('reader');
        }

        function renderSettings() {
          $('[data-setting-theme]').innerHTML = Lab.themes
            .map(
              (theme) => `<button class="f-theme-option" type="button" data-set-theme="${theme.id}" aria-pressed="${Lab.prefs.theme === theme.id}">
                <span class="f-theme-chip" style="background:${themeColors(theme.id)[0]};border-bottom:3px solid ${themeColors(theme.id)[2]}"></span>
                <b>${theme.name}</b>
              </button>`,
            )
            .join('');
          $('[data-setting-font]').innerHTML = Object.entries(Lab.fonts)
            .map(
              ([id, font]) => `<button class="f-font-option" type="button" data-set-font="${id}" aria-pressed="${Lab.prefs.font === id}">
                <span style="font-family:${font.stack};font-size:0.92rem">อ่านอีกนิด</span><small>${font.label}</small>
              </button>`,
            )
            .join('');
          $('[data-setting-dialogue]').innerHTML = Lab.dialogues
            .map(
              (dialogue) => `<button class="f-dialogue-option" type="button" data-set-dialogue="${dialogue.id}" aria-pressed="${Lab.prefs.dialogue === dialogue.id}">
                <span>${dialogue.name}</span><small>${dialogue.hint}</small>
              </button>`,
            )
            .join('');
          syncSettings();
        }

        function syncSettings() {
          $$('[data-set-theme]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.setTheme === Lab.prefs.theme)));
          $$('[data-set-font]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.setFont === Lab.prefs.font)));
          $$('[data-set-dialogue]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.setDialogue === Lab.prefs.dialogue)));
          const size = $('[data-range-size]');
          const leading = $('[data-range-leading]');
          if (size) size.value = Lab.prefs.size;
          if (leading) leading.value = Lab.prefs.leading;
          if ($('[data-value-size]')) $('[data-value-size]').textContent = `${Lab.prefs.size}px`;
          if ($('[data-value-leading]')) $('[data-value-leading]').textContent = `${Number(Lab.prefs.leading).toFixed(1)}x`;
        }

        function themeColors(id) {
          if (id === 'dark') return ['#11100e', '#ece4d6', '#d97a60'];
          if (id === 'sepia') return ['#ece0cb', '#2a2117', '#8c5426'];
          return ['#f3ecdf', '#221e19', '#a8452f'];
        }

        document.addEventListener('lab:prefs', () => {
          if ($('[data-settings]').open) syncSettings();
        });

        document.addEventListener('click', (event) => {
          const book = event.target.closest('[data-book]');
          if (book) {
            renderDetail(Lab.novelById(book.dataset.book));
            return;
          }

          if (event.target.closest('[data-hero-read]')) {
            renderReader(continueNovel, continueChapter.id);
            return;
          }

          if (event.target.closest('[data-hero-detail]')) {
            renderDetail(continueNovel);
            return;
          }

          const chapter = event.target.closest('[data-chapter]');
          if (chapter) {
            const dialog = chapter.closest('dialog');
            if (dialog) dialog.close();
            renderReader(currentNovel, chapter.dataset.chapter);
            return;
          }

          if (event.target.closest('[data-open-reader]')) {
            if (currentNovel.chapters.length) renderReader(currentNovel, Lab.firstReadingChapter(currentNovel).id);
            return;
          }

          if (event.target.closest('[data-nav="shelf"]')) {
            Lab.showScreen('shelf');
            return;
          }
          if (event.target.closest('[data-nav="detail"]')) {
            Lab.showScreen('detail');
            return;
          }

          if (event.target.closest('[data-open-settings]')) {
            renderSettings();
            $('[data-settings]').showModal();
            return;
          }
          if (event.target.closest('[data-close-settings]')) {
            $('[data-settings]').close();
            return;
          }
          if (event.target.closest('[data-open-toc]')) {
            $('[data-toc]').showModal();
            return;
          }
          if (event.target.closest('[data-close-toc]')) {
            $('[data-toc]').close();
            return;
          }

          if (event.target.closest('[data-set-theme]')) {
            Lab.set({ theme: event.target.closest('[data-set-theme]').dataset.setTheme });
            return;
          }
          if (event.target.closest('[data-set-font]')) {
            Lab.set({ font: event.target.closest('[data-set-font]').dataset.setFont });
            return;
          }
          if (event.target.closest('[data-set-dialogue]')) {
            Lab.set({ dialogue: event.target.closest('[data-set-dialogue]').dataset.setDialogue });
          }
        });

        document.addEventListener('input', (event) => {
          if (event.target.matches('[data-range-size]')) Lab.set({ size: Number(event.target.value) });
          if (event.target.matches('[data-range-leading]')) Lab.set({ leading: Number(event.target.value) });
        });

        $('[data-settings]').addEventListener('click', (event) => {
          if (event.target === $('[data-settings]')) $('[data-settings]').close();
        });
        $('[data-toc]').addEventListener('click', (event) => {
          if (event.target === $('[data-toc]')) $('[data-toc]').close();
        });

        renderShelf();
      })();
    </script>
  </body>
